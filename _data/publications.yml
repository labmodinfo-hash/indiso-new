  - year: 2026
    category: "Проект визуальных кодов"
    title: "Семиотические коды и визуальный регистр современной экранной анимации: сравнительный мультимодальный анализ"
    authors: "Рубцова М.В."
    source: "Международный научно-исследовательский журнал. 2026. № 10 (172)."
    doi: "10.60797/IRJ.2026.172.5"
    abstract: "Выявляются и систематизируются семиотические коды, формирующие визуальный регистр современной японской анимации. На материале четырёх культовых сериалов («Евангелион», «Эксперименты Лейн», «Монстр», «Атака титанов») разработана авторская схема из шести групп кодов. Визуальный регистр аниме рассматривается как открытая, самоописывающая семиотическая система."
    pdf: "/assets/pdf/rubtsova-2026-semiotic-codes.pdf"
    cite: "Рубцова М.В. Семиотические коды и визуальный регистр современной экранной анимации: сравнительный мультимодальный анализ // Международный научно-исследовательский журнал. 2026. № 10 (172). DOI: 10.60797/IRJ.2026.172.5."
  - year: 2026
    category: "Проект фольклора и мифа"
    title: "Репрезентация аномального: разработка и апробация мультимодального контент-анализа"
    authors: "Рубцова М.В."
    source: "Российский лингвистический бюллетень. 2026. № 9 (81)."
    doi: "10.60797/RULB.2026.81.3"
    abstract: "Прослеживается трансформация образа аномального в трёх аниме-сериалах: «Puella Magi Madoka Magica», «Атака титанов» и «Сага о Винланде». Анализ тридцати ключевых сцен проведён по пяти порядковым параметрам (межкодерская надёжность κ = 0,73). Выделены три сценария гуманизации монстра: кавайная субверсия, линейная дегротескизация и нарративная интернализация."
    pdf: "/assets/pdf/rubtsova-2026-representing-anomalous.pdf"
    cite: "Рубцова М.В. Репрезентация аномального: разработка и апробация мультимодального контент-анализа // Российский лингвистический бюллетень. 2026. № 9 (81). DOI: 10.60797/RULB.2026.81.3."
  - year: 2026
    category: "Архив архетипов"
    title: "Анализ коммуникативных моделей субъектности в массовой культуре"
    authors: "Рубцова М.В."
    source: "Российский лингвистический бюллетень. 2026. № 6 (78)."
    doi: "10.60797/RULB.2026.78.19"
    abstract: "На материале аниме «Монстр» Наоки Урасавы выявлены три коммуникативные модели субъектности: «кармическая диада», «расщеплённый субъект» и «диалогический ответ». Анализ опирается на аналитическую психологию К. Г. Юнга и подход Хаяо Каваи, синтезирующий буддизм и юнгианство."
    pdf: "/assets/pdf/rubtsova-2026-communicative-models.pdf"
    cite: "Рубцова М.В. Анализ коммуникативных моделей субъектности в массовой культуре // Российский лингвистический бюллетень. 2026. № 6 (78). DOI: 10.60797/RULB.2026.78.19."
