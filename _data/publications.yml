    source: "Российский лингвистический бюллетень. 2026. № 9 (81)."
    doi: "10.60797/RULB.2026.81.3"
    abstract: "Прослеживается трансформация образа аномального в трёх аниме-сериалах: «Puella Magi Madoka Magica», «Атака титанов» и «Сага о Винланде». Анализ тридцати ключевых сцен проведён по пяти порядковым параметрам (межкодерская надёжность κ = 0,73). Выделены три сценария гуманизации монстра: кавайная субверсия, линейная дегротескизация и нарративная интернализация."
    pdf: "/assets/pdf/rubtsova-2026-representing-anomalous.pdf"
    cite: "Рубцова М.В. Репрезентация аномального: разработка и апробация мультимодального контент-анализа // Российский лингвистический бюллетень. 2026. № 9 (81). DOI: 10.60797/RULB.2026.81.3."
