    title: "Онтологический поворот в нарратологии: концепция автономности мира в теории М. Дж. П. Вульфа"
    authors: "Рубцова А.В., Рубцова М.В., Мартьянова Н.А."
    source: "Казанская наука. 2026. № 3. С. 616–618."
    doi: ""
    abstract: "Рассматривается концепция воображаемых миров Марка Дж. П. Вульфа в контексте междисциплинарного «онтологического поворота». Анализируется сдвиг от классического нарратоцентризма, где мир служит фоном сюжета, к подходу, признающему автономность воображаемого мира в медиатекстах."
    pdf: "/assets/pdf/rubtsova-2026-ontological-turn-1.pdf"
