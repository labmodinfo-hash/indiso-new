---
layout: default
---
<article class="post-wrapper">
    {% if page.image %}
        <img src="{{ page.image }}" alt="{{ page.title }}" class="post-cover">
    {% endif %}
    <div class="post-meta">{{ page.category }} • {{ page.date | date: "%d.%m.%Y" }}</div>
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.excerpt %}
        <div class="post-lead">{{ page.excerpt }}</div>
    {% endif %}
    <div class="post-content">
        {{ content }}
    </div>
</article>
